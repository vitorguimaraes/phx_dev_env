name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # weekly, because new vulnerabilities show up without any change in the code
  schedule:
    - cron: "0 6 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    # same Elixir/OTP line as Dockerfile.dev (Debian based, so the actions run on it)
    container: elixir:1.19
    env:
      MIX_ENV: test
    # db:start
    # named db_service, the hostname in config/test.exs
    services:
      db_service:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: __POSTGRES_USER__
          POSTGRES_PASSWORD: __POSTGRES_PASSWORD__
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # db:end

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}
          restore-keys: mix-

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get

      # the same checks as `mix precommit`, without changing files
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix sobelow --skip --exit low --ignore Vuln
      - run: mix deps.audit
      - run: mix hex.audit
      - run: mix test

  # secrets committed by mistake (API keys, tokens, passwords), in the whole history
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --config /repo/.gitleaks.toml

  # known vulnerabilities in the production image (OS packages and runtime); it also checks
  # that the release Dockerfile still builds. Slow, so not on pull requests
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Trivy from its Docker image, like gitleaks (trivy-action downloads the binary from
      # get.trivy.dev, which is down)
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --scanners vuln app:ci
