services:
  app_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
        APP_PORT: ${APP_PORT}
    image: ${APP_IMAGE_NAME}
    container_name: ${APP_CONTAINER_NAME}
    # keep the container idle; the server is started manually inside it (make app)
    command: sleep infinity
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - iex_history:/home/app/.cache/erlang-history
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POOL_SIZE: ${POOL_SIZE}
      PORT: ${APP_PORT}
      # keep the IEx history between sessions (stored in the iex_history volume)
      ERL_AFLAGS: "-kernel shell_history enabled"
    ports:
      - "${APP_HOST_PORT}:${APP_PORT}"
    networks:
      - app_net
    depends_on:
      db_service:
        condition: service_healthy

  db_service:
    image: postgres:18-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # only reachable from this machine
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

# named by compose after the project's folder, so each project has its own network
networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  iex_history:
